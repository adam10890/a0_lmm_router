active_slots:
- id: slot_chat
  port: 8080
  model_id: gemma-4-E4B-it-uncensored-Q4_K_M
  role: chat
  context_size: 65536
  gpu_layers: -1
  batch_size: 512
  threads: 8
  parallel_slots: 1
  flash_attention: true
  enabled: true
- id: slot_utility
  port: 8088
  model_id: qwen3_5_9b
  role: utility
  context_size: 16384
  gpu_layers: -1
  batch_size: 512
  threads: 4
  parallel_slots: 1
  flash_attention: true
  enabled: true
- id: slot_embedding
  port: 8082
  model_id: nomic_embed
  role: embedding
  context_size: 8192
  gpu_layers: -1
  batch_size: 512
  threads: 4
  parallel_slots: 8
  embedding_mode: true
  enabled: true
slot_defaults:
  gpu_layers: -1
  batch_size: 512
  threads: 4
  parallel_slots: 1
  flash_attention: true
  fit: true
  fit_target_mib: 1024
  fit_ctx_min: 4096
  extra_args: []
  no_mmap: false
  mlock: false
  cpu_moe: null
  cache_type_k: null
  cache_type_v: null
global:
  auto_start: false
  backend: remote
  lmm_hosts:
    chat: host.docker.internal:8080
    utility: host.docker.internal:8088
    embedding: host.docker.internal:8082
  docker_image_gpu: ghcr.io/ggml-org/llama.cpp:server-cuda
  docker_image_cpu: ghcr.io/ggml-org/llama.cpp:server
  docker_network: a0-lmm-net
  gpu_count: all
  models_dir: ''
  llama_cpp_path: /usr/local/bin
  server_binary: llama-server
  use_wsl: false
  startup_timeout: 180
  health_check_interval: 30
  auto_restart: true
  max_restart_attempts: 3
  log_level: info
  log_dir: logs/llama_cpp
hardware:
  gpus:
  - id: gpu_0
    name: NVIDIA RTX 4090
    vram_gb: 24
    cuda_cores: 16384
    cuda_device: 0
    enabled: true
  cpus:
  - id: cpu_0
    name: Host CPU
    cores: 16
    threads: 32
    enabled: true
  ram:
    total_gb: 63
    reserved_gb: 8
    available_gb: 55
  limits:
    max_concurrent_gpu_models: 3
    max_concurrent_cpu_models: 1
    max_total_models: 4
mcp_server:
  enabled: true
  host: 0.0.0.0
  port: 8095
