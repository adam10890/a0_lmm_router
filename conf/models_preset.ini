; models_preset.ini - generated by a0_lmm_router context planner
; Role ctx values are minimums; ctx-size below is the planned hard context.

[*]
n-gpu-layers = 999
batch-size = 512
ubatch-size = 1024
cache-type-k = q8_0
cache-type-v = q8_0
flash-attn = on

[chat]
alias = chat
model = /models/unsloth--gemma-4-12B-it-GGUF/gemma-4-12b-it-Q4_K_M.gguf
ctx-size = 65536

[utility]
alias = utility
model = /models/utility/qwen3.5_9b/Qwen3.5-9B-Q4_K_M.gguf
ctx-size = 32768

[embedding]
alias = embedding
model = /models/embedding/nomic/nomic-embed-text-v1.5.Q4_K_M.gguf
ctx-size = 2048
embedding = true

[scribe]
; Super-ego documentation model for the a0_scribe plugin (gemma-4-8b).
; Primary scribe inference runs on the dedicated scribe_gpu slot (port 8090,
; docker/docker-compose.lmm.scribe.yml). This preset entry is the router-mode
; fallback used when that container is down. Ensure the GGUF path below exists
; (or point it at another installed local model).
alias = scribe
model = /models/unsloth--gemma-4-8B-it-GGUF/gemma-4-8b-it-Q4_K_M.gguf
ctx-size = 32768
